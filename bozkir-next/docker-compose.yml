# Bozkır Ağaç — full-stack Docker (Postgres + SeaweedFS S3 + Next + nginx)
# Kullanım: docker compose up -d --build
# Uygulama değişkenleri: .env.local  |  Compose değişkenleri: .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bozkir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bozkir}
      POSTGRES_DB: ${POSTGRES_DB:-bozkir}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bozkir} -d ${POSTGRES_DB:-bozkir}']
      interval: 10s
      timeout: 5s
      retries: 10
    command: postgres -c shared_buffers=256MB -c max_connections=100
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - storage-data:/data
    ports:
      - '127.0.0.1:8333:8333'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://www.bozkiragac.com}
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://www.bozkiragac.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bozkir}:${POSTGRES_PASSWORD:-bozkir}@db:5432/${POSTGRES_DB:-bozkir}
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-any}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-any}
      S3_BUCKET: ${S3_BUCKET:-bozkir-media}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-/media}
      APP_VERSION: ${APP_VERSION:-dev}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:3000/api/health?deep=1" >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  # Opsiyonel izleme (Uptime Kuma). Etkinleştirmek için:
  #   docker compose --profile monitoring up -d
  # Arayüz: http://127.0.0.1:3001  → app izleme: http://app:3000/api/health?deep=1
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ['monitoring']
    volumes:
      - uptime-data:/app/data
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
  uptime-data:
