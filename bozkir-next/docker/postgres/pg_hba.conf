# Bozkır Ağaç — özel pg_hba (PITR için replication izinleri).
# `hba_file` ile PGDATA dışından okunur; initdb'nin yazdığı dosya kullanılmaz.
# Uzaktan tüm bağlantılar şifre ister; yalnızca konteyner içi yerel/loopback güvenilir.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     scram-sha-256

# pg_basebackup (fiziksel base backup) için replication.
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
