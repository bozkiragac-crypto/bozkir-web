<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kısa bir bakım — Bozkır Ağaç Ürünleri</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f7f5; color: #111; padding: 2rem; text-align: center;
      }
      .eyebrow { letter-spacing: .16em; text-transform: uppercase; font-size: .75rem; color: #6b6b6b; margin: 0; }
      h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 1.25rem 0 0; font-weight: 500; }
      p { max-width: 32rem; margin: 1.25rem auto 0; color: #555; line-height: 1.6; }
      a.btn {
        display: inline-flex; margin-top: 2rem; padding: .85rem 1.75rem; border-radius: 999px;
        background: #111; color: #fff; text-decoration: none; font-size: .9rem; font-weight: 500;
      }
      .box { border: 1px solid #e2e2e0; background: #fff; padding: 3rem 2rem; border-radius: 1rem; max-width: 40rem; }
    </style>
  </head>
  <body>
    <main class="box">
      <p class="eyebrow">Bozkır Ağaç Ürünleri</p>
      <h1>Kısa bir bakımdayız</h1>
      <p>Siteyi sizin için güncelliyoruz. Kısa süre içinde yeniden hizmetinizde olacağız.</p>
      <a class="btn" href="/">Yeniden deneyin</a>
    </main>
  </body>
</html>
