# Docker Compose nginx — PRODUCTION (TLS) varyantı.
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Sertifika host üzerinde Let's Encrypt ile alınır ve /etc/letsencrypt altına yazılır.
# ÖNEMLİ: Farklı bir alan adı kullanacaksanız aşağıdaki `server_name` ve
# ssl_certificate yollarını kendi domaininize göre değiştirin (ya da
# docker-compose.prod.yml içindeki SERVER_NAME değişkenini kullanın).

# WebSocket upgrade yalnızca gerektiğinde (keepalive'ı bozmaz).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker DNS: upstream'ler app yeniden oluşturulunca IP'yi otomatik yenilesin.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Cloudflare turuncu bulut (proxy) kullanıyorsanız GERÇEK IP'nin korunması şart:
# aksi halde $remote_addr tüm ziyaretçiler için Cloudflare IP'si olur ve
# IP tabanlı hız sınırı (limit_req) tek IP gibi davranır.
# Aşağıdaki blokları açın ve Cloudflare IP aralıklarını güncel listeden alın:
# https://www.cloudflare.com/ips-v4  /  https://www.cloudflare.com/ips-v6
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
#
# IPv6 (yalnızca IPv6 bağlantıları kullanıyorsanız):
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
#
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;
# ---------------------------------------------------------------------------

upstream bozkir_next {
    zone bozkir_next 64k;
    server app:3000 resolve;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream bozkir_media {
    zone bozkir_media 64k;
    server storage:8333 resolve;
    keepalive 16;
}

# IP tabanlı hız sınırı (uygulama içi limitlerin önünde).
limit_req_zone $binary_remote_addr zone=teklif_zone:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=page_zone:10m rate=300r/m;
# Eşzamanlı bağlantı sınırı (yavaş/yığın istek koruması).
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# HTTP (80): yalnızca ACME sertifika doğrulaması + HTTPS'e yönlendirme.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bozkiragac.com www.bozkiragac.com;
    server_tokens off;

    # Let's Encrypt webroot doğrulaması (bu location redirect'ten ÖNCE gelmeli).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type 'text/plain';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (443): asıl sunucu.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bozkiragac.com www.bozkiragac.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bozkiragac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bozkiragac.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # OCSP stapling için genel DNS (Docker DNS dış kaynakları çözemez).
    # Sunucu seviyesinde tanımlanır; http seviyesindeki Docker resolver'ı ezmez.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    charset utf-8;
    client_max_body_size 25M;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Gzip (text varlıklar).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # HSTS bu dosyada yalnızca HTTPS'te anlamlıdır.
    include /etc/nginx/snippets/security-headers.conf;

    # Uygulama çöktüğünde (502/504) statik bakım sayfası gösterilir.
    # 503 bilinçli olarak geçirilir: Next bakım modu kendi sayfasını döndürür.
    error_page 502 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Nesne depolama (SeaweedFS S3) — public medya. `/media/<key>` -> `<bucket>/<key>`
    # Private teklif ekleri (quotes/) public olarak servis edilmez.
    # `^~`: aşağıdaki uzantı regex'lerinin bu prefix'i ezmesini engeller.
    location ^~ /media/quotes/ {
        return 404;
    }

    location ^~ /media/ {
        proxy_pass http://bozkir_media/bozkir-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Next statik varlıkları — uzun cache. `^~` ile regex'ten korunur.
    location ^~ /_next/static/ {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Üretilmiş görseller (next/image) — uzun cache.
    location /_next/image {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Katalog PDF'leri — değişmez içerik, uzun cache.
    location ^~ /catalog/ {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Public klasör varlıkları (ikon, görsel) — orta cache.
    location ~* \.(?:ico|png|jpe?g|webp|avif|svg|woff2?|ttf|pdf)$ {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Giriş: brute-force koruması.
    location /admin/login {
        limit_req zone=login_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Teklif API: hız sınırı + gövde boyutu (dosya eki için).
    # XFF istemciden gelen değerle APPEND edilmez; gerçek IP yazılır ki
    # uygulama içi IP limiti sahte XFF ile atlatılamasın.
    location /api/teklif {
        limit_req zone=teklif_zone burst=2 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 10;
        client_max_body_size 12M;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Sağlık ve diğer API'ler — hafif genel limit.
    location /api/ {
        limit_req zone=api_zone burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=page_zone burst=100 nodelay;
        limit_conn conn_zone 60;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket/HMR upgrade yalnızca istendiğinde (aksi halde keepalive korunur).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}