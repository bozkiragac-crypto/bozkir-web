# Docker Compose nginx ters proxy (app:3000) + medya (storage:8333)

# WebSocket upgrade yalnızca gerektiğinde (keepalive'ı bozmaz).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bozkir_next {
    server app:3000;
    keepalive 32;
}

upstream bozkir_media {
    server storage:8333;
    keepalive 8;
}

# Teklif formu için IP tabanlı hız sınırı (uygulama içi limitin önünde).
limit_req_zone $binary_remote_addr zone=teklif_zone:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Yavaş istemci/büyük yük koruması.
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nesne depolama (SeaweedFS S3) — public medya. `/media/<key>` -> `<bucket>/<key>`
    # Private teklif ekleri (quotes/) public olarak servis edilmez.
    location /media/quotes/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://bozkir_media/bozkir-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location /_next/static/ {
        proxy_pass http://bozkir_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Teklif API: hız sınırı + gövde boyutu (dosya eki için).
    location /api/teklif {
        limit_req zone=teklif_zone burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 12M;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket/HMR upgrade yalnızca istendiğinde (aksi halde keepalive korunur).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
