# Docker Compose nginx ters proxy (app:3000) + medya (storage:8333)
# VPS optimizasyonları: keepalive, gzip, statik cache, güvenlik başlıkları, hız sınırı.

# WebSocket upgrade yalnızca gerektiğinde (keepalive'ı bozmaz).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bozkir_next {
    server app:3000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream bozkir_media {
    server storage:8333;
    keepalive 16;
}

# IP tabanlı hız sınırları (uygulama içi limitlerin önünde).
limit_req_zone $binary_remote_addr zone=teklif_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;

# Basit durum ucu (izleme için; yalnızca localhost dinleyen isteklerde 200).
server {
    listen 80;
    server_name _;
    server_tokens off;

    charset utf-8;
    client_max_body_size 25M;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Gzip (text varlıklar).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Güvenlik başlıkları (TLS sonrası HSTS üretimde eklenir).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nesne depolama (SeaweedFS S3) — public medya. `/media/<key>` -> `<bucket>/<key>`
    # Private teklif ekleri (quotes/) public olarak servis edilmez.
    location /media/quotes/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://bozkir_media/bozkir-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next statik varlıkları — uzun cache.
    location /_next/static/ {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Üretilmiş görseller (next/image) — uzun cache.
    location /_next/image {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public klasör varlıkları (ikon, görsel, pdf) — orta cache.
    location ~* \.(?:ico|png|jpe?g|webp|avif|svg|woff2?|ttf|pdf)$ {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Giriş: brute-force koruması.
    location /admin/login {
        limit_req zone=login_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Teklif API: hız sınırı + gövde boyutu (dosya eki için).
    location /api/teklif {
        limit_req zone=teklif_zone burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 12M;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sağlık ve diğer API'ler — hafif genel limit.
    location /api/ {
        limit_req zone=api_zone burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket/HMR upgrade yalnızca istendiğinde (aksi halde keepalive korunur).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
