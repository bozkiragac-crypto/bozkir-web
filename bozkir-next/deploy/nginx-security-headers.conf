# Ortak güvenlik başlıkları. nginx'te bir location'da add_header varsa server
# seviyesindekiler miras alınmadığı için bu dosya her location'da include edilir.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS yalnızca HTTPS üzerinden anlamlıdır; HTTP'de tarayıcılar yok sayar.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
