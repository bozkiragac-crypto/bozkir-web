# next/image üretilmiş görseller ve /media orijinalleri için nginx edge cache.
# Bu dosya conf.d/ içine mount edilir; http bloğu içinde geçerlidir.
#
# Amaç: next/image ilk istekte görsel başına optimizasyon (WebP encode) yapar;
# sonraki kullanıcılar için yanıtı nginx'te önbelleğe alıp upstream'e (Next/
# SeaweedFS) tekrar gitmeyi önlemek. Böylece görseller belirgin biçimde hızlanır.
proxy_cache_path /var/cache/nginx/img
    levels=1:2
    keys_zone=img_cache:20m
    max_size=2g
    inactive=30d
    use_temp_path=off;

# Halka açık, dil önekli HTML sayfaları için kısa süreli edge cache.
# SSR maliyetini tekrar eden ziyaretçilerde ortadan kaldırır; admin/API ve
# dil öneki olmayan (yerelleştirme yönlendirmesi yapan) yollar bypass edilir.
proxy_cache_path /var/cache/nginx/page
    levels=1:2
    keys_zone=page_cache:10m
    max_size=256m
    inactive=5m
    use_temp_path=off;

# Yalnızca /tr, /en, /ar ile başlayan yollar cache'e uygun.
map $uri $bozkir_cache_uri_bypass {
    default         1;
    ~^/(tr|en|ar)(/|$) 0;
}

map $request_method $bozkir_cache_method_bypass {
    default 1;
    GET     0;
    HEAD    0;
}

# Tarayıcı cache başlığı yalnızca nginx'in de cache'lediği halka açık yollarda
# public olmalı. Admin ve RSC istekleri bypass edildiği için no-store döner;
# aksi halde tarayıcı 30 sn boyunca eski admin listesini gösterir.
map $bozkir_cache_uri_bypass $bozkir_cache_control {
    default "no-store";
    0       "public, max-age=30";
}

# Next Router'ın `_rsc` prefetch istekleri tek sayfada onlarca URL açar.
# Aynı IP'nin normal gezinme bütçesini tüketmemeleri için ayrı anahtar kullanır.
map $arg__rsc $bozkir_page_limit_key {
    default $binary_remote_addr;
    ~.      "$binary_remote_addr:$uri:$arg__rsc";
}
