# next/image üretilmiş görseller ve /media orijinalleri için nginx edge cache.
# Bu dosya conf.d/ içine mount edilir; http bloğu içinde geçerlidir.
#
# Amaç: next/image ilk istekte görsel başına optimizasyon (WebP encode) yapar;
# sonraki kullanıcılar için yanıtı nginx'te önbelleğe alıp upstream'e (Next/
# SeaweedFS) tekrar gitmeyi önlemek. Böylece görseller belirgin biçimde hızlanır.
proxy_cache_path /var/cache/nginx/img
    levels=1:2
    keys_zone=img_cache:20m
    max_size=2g
    inactive=30d
    use_temp_path=off;
