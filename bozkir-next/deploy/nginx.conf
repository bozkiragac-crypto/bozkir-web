# Örnek nginx ters proxy — /etc/nginx/sites-available/bozkiragac.com
# certbot ile TLS eklendikten sonra 443 bloğu kullanılır.

upstream bozkir_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name bozkiragac.com www.bozkiragac.com;
    return 301 https://www.bozkiragac.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.bozkiragac.com;

    # ssl_certificate     /etc/letsencrypt/live/bozkiragac.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bozkiragac.com/privkey.pem;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js statik varlıkları: uzun ömürlü önbellek
    location /_next/static/ {
        proxy_pass http://bozkir_next;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://bozkir_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
