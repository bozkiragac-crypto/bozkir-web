name: Deploy (VPS)

# main'e push → CI (lint, typecheck, unit, build, E2E) → CI yeşilse otomatik dağıtım.
# Elle yeniden dağıtım / acil rollback için Actions sekmesinden "Run workflow".
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: VPS'e dağıt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Yalnızca main'e yapılan push'un CI'sı başarılıysa veya manuel tetiklemede çalışır.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Secret kontrolü
        id: preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PATH; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Otomatik dağıtım atlandı — eksik GitHub Actions secret:$missing"
            {
              echo "### Dağıtım atlandı"
              echo
              echo "Eksik secret(lar): \`$missing\`"
              echo
              echo "Kurulum: repo → Settings → Secrets and variables → Actions."
              echo "Ayrıntı: \`docs/DEPLOY.md\` / \`docs/GITHUB.md\`."
              echo "Secret'lar eklenince main'e yapılan ilk push otomatik dağıtılır."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: SSH ile deploy (yedek + sürüm + otomatik rollback)
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eo pipefail
            cd ${{ secrets.VPS_PATH }}
            git fetch --all
            git checkout --force main
            # DİKKAT: commit edilmemiş domain/nginx özelleştirmeleri burada silinir.
            git reset --hard origin/main
            cd bozkir-next

            # Prod override (TLS/443 + sertifika mount) HER komutta uygulanır;
            # aksi halde nginx HTTP'ye düşer ve TLS kaybolur.
            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Compose değişkenleri (POSTGRES_* vb.) shell'e alınır (pg_dump için).
            if [ -f .env ]; then set -a; . ./.env; set +a; fi

            # 0) Migrasyon öncesi hızlı yedek (başarısızsa deploy durur).
            mkdir -p backups/pre-deploy
            $DC exec -T db pg_dump -U "${POSTGRES_USER:-bozkir}" "${POSTGRES_DB:-bozkir}" \
              | gzip > "backups/pre-deploy/pre-$(date +%Y%m%d_%H%M%S).sql.gz"
            # Son 10 pre-deploy yedeği kalsın.
            ls -1t backups/pre-deploy/*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm -f || true

            # 1) Sürümlü imaj: önceki sürümü hatırla, yeni sürümü etiketle.
            PREV_TAG="$(cat .last-good-tag 2>/dev/null || true)"
            TAG="$(git rev-parse --short HEAD)"
            echo "Dağıtılan sürüm: $TAG (önceki: ${PREV_TAG:-yok})"
            APP_TAG="$TAG" $DC build app
            APP_TAG="$TAG" $DC up -d
            # App IP'si değişti; nginx upstream DNS'ini yeniden çöz.
            $DC restart nginx >/dev/null

            # 2) Şema migrasyonu (idempotent) + tohumlama (mevcut veriyi ezmez).
            $DC exec -T app node scripts/db-migrate.mjs
            $DC exec -T app node scripts/seed-catalog-meta.mjs || true
            $DC exec -T app node scripts/seed-content-i18n.mjs || true

            # 3) Sağlık kontrolü: nginx yönlendirmesinden bağımsız, uygulamaya
            #    doğrudan sorulur (HTTP:301'i başarı saymamak için).
            OK=0
            for i in $(seq 1 20); do
              if $DC exec -T app wget -qO- "http://127.0.0.1:3000/api/health?deep=1" >/dev/null 2>&1; then
                OK=1; break
              fi
              sleep 3
            done
            if [ "$OK" != "1" ]; then
              echo "Sağlık kontrolü başarısız; önceki sürüme dönülüyor..." >&2
              if [ -n "$PREV_TAG" ]; then
                APP_TAG="$PREV_TAG" $DC up -d
                $DC restart nginx >/dev/null
                echo "Rollback tamam: $PREV_TAG" >&2
              fi
              $DC logs --tail=80 app
              exit 1
            fi

            echo "$TAG" > .last-good-tag

            # Eski sürüm imajlarını buda (son 5 kalsın).
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | grep '^bozkir-app:' | awk 'NR>5 {print $2}' \
              | xargs -r docker rmi -f >/dev/null 2>&1 || true

            echo "Sağlıklı ✓ (sürüm: $TAG)"
